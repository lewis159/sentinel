# =============================================================================
# Sentinel — APP-ONLY validation stack for ops.bentech.dev
# =============================================================================
# PURPOSE: stand up JUST the Next.js app so we can VALIDATE prod Clerk sign-in /
# SSO and the global_admin gate end-to-end against ops.bentech.dev — WITHOUT the
# full HA database tier. There is intentionally NO database here.
#
#   * No DATABASE_URL is set. lib/db.ts sets `hasDb = false` when DATABASE_URL is
#     unset, and q()/q1() return empty results — so every page renders, but all
#     DATA pages will be EMPTY. That is expected and fine for auth validation.
#     Real data lands when the full HA stack (sentinel-stack.prod.yml) is deployed.
#
# SECRETS vs ENV:
#   * CLERK_SECRET_KEY is sensitive → supplied as a DOCKER SECRET (clerk_secret_key).
#     The image entrypoint shim (docker-entrypoint.sh) reads /run/secrets/clerk_secret_key
#     at startup and exports it as the CLERK_SECRET_KEY env var the Clerk SDK expects.
#     NOTE: a Swarm secret named `clerk_secret_key` ALREADY EXISTS on this Swarm
#     (created 2026-06-18, holds the rotated prod sk_live_ for the SAME estate Clerk
#     instance) — so you likely DON'T need to create it; this stack just references it.
#   * NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is PUBLIC (inlined into the client bundle),
#     so it stays a plain env var / build-arg — never a secret.
#
# DEPLOY (Portainer, endpoint Id 3 "local" Swarm):
#   1. Confirm the `clerk_secret_key` secret exists (Secrets) — reuse it. Only
#      create it if missing:  printf '%s' 'sk_live_...' | docker secret create clerk_secret_key -
#   2. Portainer → Stacks → Add stack, name it `sentinel-ops-app` (Swarm mode).
#      (Per [[feedback-docker-cleanup]] this is a NEW stack — do not touch
#       yt-transcriber / hermes-agent / springsteen-news.)
#   3. Paste this file (or point at deploy/sentinel-stack.ops-app.yml).
#   4. Stack env editor → set the public Clerk value:
#        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = pk_live_...   (publishable, not secret)
#   5. Deploy. The entrypoint turns the secret into CLERK_SECRET_KEY at runtime.
#
# INGRESS: the LIVE nginx HA / NPM tier lives on the external `yt-shared` overlay
# (verified live — the YT app uses `yt-shared` for ingress, NOT `proxy`). Add an
# NPM proxy host  ops.bentech.dev → app:3000  over `yt-shared`. No reverse proxy
# is defined in this file.
#
# NOTE: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is ALSO baked into the image at build
# time by CI (inlined into the client bundle); it's repeated at runtime so server
# reads line up. Both must be the SAME prod publishable key.
# =============================================================================

version: "3.8"

services:

  # ===========================================================================
  # app — stateless Sentinel API/UI. Fronted by the LIVE nginx HA / NPM tier on
  # the `yt-shared` network for ops.bentech.dev. DB-less for validation.
  # ===========================================================================
  app:
    image: ghcr.io/lewis159/sentinel:latest
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://ops.bentech.dev
      # Publishable key — PUBLIC, set in the Portainer stack env editor. Also
      # baked into the image at build time (inlined into the client bundle).
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      # CLERK_SECRET_KEY is NOT set here: it comes from the `clerk_secret_key`
      # docker secret below, which the entrypoint shim exports at runtime.
      # NO DATABASE_URL on purpose: lib/db.ts -> hasDb=false, queries return [].
    secrets:
      - clerk_secret_key
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - yt-shared       # external — LIVE NPM/ingress tier lives here (per deploy-reality; NOT proxy)
    deploy:
      replicas: 1       # validation only; safe to scale up (app is stateless)
      labels:
        - "project=Sentinel"
        - "project.component=app"
        - "project.env=ops-validation"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits: { memory: 512M }

# =============================================================================
# Secrets — `clerk_secret_key` already exists on this Swarm (reuse it). The
# entrypoint shim exports /run/secrets/clerk_secret_key → CLERK_SECRET_KEY.
# =============================================================================
secrets:
  clerk_secret_key:
    external: true

# =============================================================================
# Networks — the LIVE external ingress overlay. The nginx HA / NPM tier owns
# `yt-shared` (verified live) and routes ops.bentech.dev → app:3000 over it.
# =============================================================================
networks:
  yt-shared:
    external: true
    name: yt-shared
