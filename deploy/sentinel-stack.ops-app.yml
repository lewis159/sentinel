# =============================================================================
# Sentinel — APP-ONLY validation stack for ops.bentech.dev
# =============================================================================
# PURPOSE: stand up JUST the Next.js app so we can VALIDATE prod Clerk sign-in /
# SSO and the global_admin gate end-to-end against ops.bentech.dev — WITHOUT the
# full HA database tier. There is intentionally NO database here.
#
#   * No DATABASE_URL is set. lib/db.ts sets `hasDb = false` when DATABASE_URL is
#     unset, and q()/q1() return empty results — so every page renders, but all
#     DATA pages will be EMPTY. That is expected and fine for auth validation.
#     Real data lands when the full HA stack (sentinel-stack.prod.yml) is deployed.
#
# SECRETS vs ENV:
#   * CLERK_SECRET_KEY is sensitive, so it is supplied as a DOCKER SECRET
#     (clerk_secret_key) — the same pattern as the full HA prod stack. The image
#     entrypoint shim (docker-entrypoint.sh) reads /run/secrets/clerk_secret_key
#     at startup and exports it as the CLERK_SECRET_KEY env var the Clerk SDK
#     expects. The secret never appears in the stack definition or env editor.
#   * NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is PUBLIC (it is inlined into the client
#     bundle), so it stays a plain env var / build-arg — never a secret.
#   * There is still NO DATABASE_URL here (DB-less validation, see above).
#
# CREATE THE SECRET FIRST (one-time, before deploy):
#   * Portainer: Secrets → Add secret → name `clerk_secret_key`, value = the
#     `sk_live_...` Clerk secret key. (Swarm secrets are immutable; to rotate,
#     delete + recreate the secret and redeploy / `docker service update`.)
#   * OR via CLI on a manager node:
#       printf '%s' 'sk_live_...' | docker secret create clerk_secret_key -
#
# DEPLOY (Portainer):
#   1. Create the `clerk_secret_key` secret as above.
#   2. Portainer → Stacks → Add stack, name it `sentinel-ops-app` (Swarm mode).
#   3. Paste this file (or point at deploy/sentinel-stack.ops-app.yml).
#   4. In the stack's Environment variables editor, set the public Clerk value:
#        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = pk_live_...   (publishable, not secret)
#   5. Deploy. The entrypoint turns the secret into CLERK_SECRET_KEY at runtime.
#
# INGRESS: the EXISTING nginx HA / NPM tier on the shared external `proxy` overlay
# must proxy  ops.bentech.dev → app:3000  over that `proxy` network (same pattern
# as the YT Transcriber stack). No reverse proxy is defined in this file.
#
# NOTE: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is ALSO baked into the image at build
# time by CI (it's inlined into the client bundle). It's repeated at runtime here
# so server-side reads + any runtime checks line up; both should be the same key.
# =============================================================================

version: "3.8"

services:

  # ===========================================================================
  # app — stateless Sentinel API/UI. Fronted by the external nginx HA / NPM tier
  # on the `proxy` network for ops.bentech.dev. DB-less for validation.
  # ===========================================================================
  app:
    image: ghcr.io/lewis159/sentinel:latest
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://ops.bentech.dev
      # Publishable key — PUBLIC, set in the Portainer stack env editor. Also
      # baked into the image at build time (inlined into the client bundle).
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      # CLERK_SECRET_KEY is NOT set here: it comes from the `clerk_secret_key`
      # docker secret below, which the entrypoint shim exports at runtime.
      # NO DATABASE_URL on purpose: lib/db.ts -> hasDb=false, queries return [].
      # Data pages render EMPTY until the full HA stack (sentinel-stack.prod.yml)
      # lands. This stack validates Clerk auth + the global_admin gate only.
    secrets:
      - clerk_secret_key
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - proxy           # external — shared with nginx HA / NPM for ops.bentech.dev routing
    deploy:
      replicas: 1       # validation only; safe to scale up (app is stateless)
      labels:
        - "project=Sentinel"
        - "project.component=app"
        - "project.env=ops-validation"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits: { memory: 512M }

# =============================================================================
# Secrets — created out-of-band (see header). The entrypoint shim in the image
# exports /run/secrets/clerk_secret_key into the CLERK_SECRET_KEY env var.
# =============================================================================
secrets:
  clerk_secret_key:
    external: true

# =============================================================================
# Networks — only the shared external ingress overlay. The nginx HA / NPM tier
# owns `proxy` and routes ops.bentech.dev → app:3000 over it.
# =============================================================================
networks:
  proxy:
    external: true
    name: proxy
