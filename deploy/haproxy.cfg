global
    maxconn 200

defaults
    mode tcp
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    retries 2

# Writes → the current Patroni leader (only the leader answers 200 on /primary)
listen primary
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-1 patroni-1:5432 check port 8008
    server patroni-2 patroni-2:5432 check port 8008

# Reads → any replica (load-balanced)
listen replicas
    bind *:5433
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server patroni-1 patroni-1:5432 check port 8008
    server patroni-2 patroni-2:5432 check port 8008

# HAProxy stats UI (optional)
listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
