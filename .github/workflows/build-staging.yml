name: Build & Push (STAGING) Sentinel

# Staging build of the Sentinel image. Mirrors build-push.yml EXACTLY (same
# context, same Dockerfile, same cache) with two differences:
#   1. it builds a CHOSEN branch/ref (default feat/email-portal), not just main;
#   2. it bakes the Clerk DEV publishable key (pk_test) into the client bundle
#      instead of the prod pk_live repo variable.
#
# NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is the only NEXT_PUBLIC value baked at build
# time (same as build-push.yml). NEXT_PUBLIC_APP_URL is set at RUNTIME by the
# staging stack (stacks/sentinel-ops-staging.yml), matching how prod does it.
#
# pk_test is PUBLIC (client-side), so it's a workflow_dispatch input with the
# shared Clerk DEV instance default — NOT a repo secret. Output is tagged
# :staging-<sha> (+ moving :staging) so it can never be mistaken for a prod
# (:latest) image.
#
# NOTE ON REDEPLOY MECHANISM: this staging workflow intentionally keeps the
# service-webhook redeploy below, NOT the GitOps git-stack flow used by prod
# (build-push.yml). Staging is NOT a git-managed Portainer stack: its compose
# file (sentinel-ops-staging.yml) is not captured in bentech-infra, so there is
# no stack file to bump and no git-stack webhook to POST. If/when the staging
# stack is captured into bentech-infra and converted to a Git stack, migrate
# this to the same flavor-B flow as build-push.yml.
#
# Optional auto-redeploy of the STAGING service uses its OWN independent secret
# so it can never touch the prod service:
#   Redeploy secret: PORTAINER_WEBHOOK_SENTINEL_STAGING
#     - Opaque Portainer service-webhook URL for the *staging* Sentinel service
#       (https://<portainer-host>/api/webhooks/<uuid>). Distinct from the prod
#       PORTAINER_WEBHOOK_SENTINEL — keep them separate.
#     - Create it: Portainer -> the STAGING Sentinel service -> Service webhooks
#       -> toggle ON -> copy the URL, then:
#         gh secret set PORTAINER_WEBHOOK_SENTINEL_STAGING -R lewis159/sentinel
#     - Until this secret is set the redeploy step is SKIPPED (not failed), so
#       the staging build still succeeds and the prior "bentech-infra deploy.yml"
#       path remains the way staging goes live. Set the secret only when you
#       want this build to redeploy the staging service directly.

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Branch/ref to build into the staging slot'
        required: false
        default: 'feat/email-portal'
        type: string
      clerk_publishable_key:
        description: 'Clerk DEV publishable key (pk_test_...) — PUBLIC'
        required: true
        default: 'pk_test_bGlnaHQtdGFkcG9sZS00OS5jbGVyay5hY2NvdW50cy5kZXYk'
        type: string

jobs:
  build-and-push-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Map the (possibly-unset) staging webhook secret to a job-level env var so
    # the redeploy step's `if:` can gate on it. Secrets can't be referenced
    # directly in `if:`, and a STEP-level env isn't visible to that step's own
    # `if:`, so it must live at job level.
    env:
      HOOK: ${{ secrets.PORTAINER_WEBHOOK_SENTINEL_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Resolve built sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push (staging build-args)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lewis159/sentinel:staging
            ghcr.io/lewis159/sentinel:staging-${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ inputs.clerk_publishable_key }}

      # Optional auto-redeploy of the STAGING service. Skipped when the staging
      # webhook secret is unset (env.HOOK == '') so this build stays a pure
      # build+push until you opt in. -f makes curl exit non-zero on any non-2xx
      # response, so a broken webhook fails the job loudly.
      - name: Trigger Portainer redeploy (staging)
        if: ${{ env.HOOK != '' }}
        run: |
          echo "Triggering Portainer STAGING service webhook for Sentinel..."
          curl -fsS -X POST "$HOOK"
          echo "Portainer staging redeploy triggered."
