name: Build & Push (STAGING) Sentinel

# Staging build of the Sentinel image. Mirrors build-push.yml EXACTLY (same
# context, same Dockerfile, same cache) with two differences:
#   1. it builds a CHOSEN branch/ref (default feat/email-portal), not just main;
#   2. it bakes the Clerk DEV publishable key (pk_test) into the client bundle
#      instead of the prod pk_live repo variable.
#
# NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is the only NEXT_PUBLIC value baked at build
# time (same as build-push.yml). NEXT_PUBLIC_APP_URL is set at RUNTIME by the
# staging stack (stacks/sentinel-ops-staging.yml), matching how prod does it.
#
# pk_test is PUBLIC (client-side), so it's a workflow_dispatch input with the
# shared Clerk DEV instance default — NOT a repo secret. Output is tagged
# :staging-<sha> (+ moving :staging) so it can never be mistaken for a prod
# (:latest) image. Deploy is a separate step (bentech-infra deploy.yml).

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Branch/ref to build into the staging slot'
        required: false
        default: 'feat/email-portal'
        type: string
      clerk_publishable_key:
        description: 'Clerk DEV publishable key (pk_test_...) — PUBLIC'
        required: true
        default: 'pk_test_bGlnaHQtdGFkcG9sZS00OS5jbGVyay5hY2NvdW50cy5kZXYk'
        type: string

jobs:
  build-and-push-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Resolve built sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push (staging build-args)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lewis159/sentinel:staging
            ghcr.io/lewis159/sentinel:staging-${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ inputs.clerk_publishable_key }}
