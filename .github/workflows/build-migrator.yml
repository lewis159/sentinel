name: build-migrator
# Builds the Sentinel migration-runner image and pushes it to GHCR when the
# migrations or the runner change. Does NOT apply anything — applying to the prod
# DB is a separate, MANUAL workflow (run-migrations-prod.yml). Sentinel has a
# single (prod) DB, so there is no auto-apply step here at all: the schema is only
# ever mutated by an explicit human trigger.
#
# Mirrors bentech-infra/.github/workflows/build-migrator.yml (minus the estate's
# staging auto-apply, which Sentinel has no equivalent of).
on:
  push:
    branches: [main]
    paths:
      - 'db/init/**'
      - 'scripts/apply-migrations.sh'
      - 'Dockerfile.migrator'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrator
          push: true
          tags: |
            ghcr.io/lewis159/sentinel-migrator:latest
            ghcr.io/lewis159/sentinel-migrator:${{ github.sha }}
