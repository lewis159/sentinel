name: Build & Push Sentinel

# Builds the Sentinel image, pushes it to GHCR, then AUTO-DEPLOYS it via the
# estate GitOps pipeline. On a prod deploy (push to main, or a manual
# workflow_dispatch) the flow is:
#
#   build+push  ghcr.io/lewis159/sentinel:<sha> (+ :latest)
#     -> checkout lewis159/bentech-infra (fine-grained PAT: GITOPS_INFRA_TOKEN)
#     -> bump the pinned image SHA in stacks/sentinel-ops-app.yml to this <sha>
#     -> commit + push to bentech-infra main
#     -> that push triggers bentech-infra's own deploy.yml (on push touching
#        stacks/*.yml), which PUTs the stack file to the Portainer API and rolls
#        the Swarm service. sentinel-ops-app is already registered in
#        bentech-infra/stacks/manifest.json (stack id 23, endpoint 3).
#
# This replaces the old Portainer git-stack service-webhook step. Portainer
# Community Edition has NO service webhooks, and the estate does NOT use them —
# every stack redeploys through bentech-infra/deploy.yml. So the SHA bump + the
# estate deploy.yml IS the deploy mechanism; nothing here talks to Portainer.
# CI holds only a scoped PAT (contents:write on bentech-infra) — never a Portainer
# token; that lives in bentech-infra's own secrets.
#
# Provisioning (see docs/sentinel-autodeploy.md):
#   GITOPS_INFRA_TOKEN  Fine-grained GitHub PAT, contents:write on
#                       lewis159/bentech-infra ONLY. Used to push the SHA bump.
#                         gh secret set GITOPS_INFRA_TOKEN -R lewis159/sentinel
#
# Until GITOPS_INFRA_TOKEN is set, the redeploy steps are SKIPPED (not failed),
# so the workflow still passes green before the PAT is provisioned. Once set, a
# failed checkout/push fails the job loudly.

on:
  push:
    branches: [main, feat/clerk-auth]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # cross-repo push uses GITOPS_INFRA_TOKEN, not GITHUB_TOKEN
      packages: write
    # Map the (possibly-unset) redeploy secret to a job-level env var so each
    # redeploy step's `if:` can gate on it. Secrets can't be referenced directly
    # in an `if:` expression, and a secret mapped at STEP level isn't visible to
    # that same step's own `if:` — so it must live at job level.
    env:
      INFRA_TOKEN: ${{ secrets.GITOPS_INFRA_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lewis159/sentinel:latest
            ghcr.io/lewis159/sentinel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* values are inlined into the client bundle at build time.
          # The Clerk publishable key is NOT secret, so it's a repo Actions VARIABLE.
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      # ── GitOps auto-deploy (SHA bump -> estate deploy.yml) ──────────────────
      # Both steps run ONLY for prod deploys (push to main, or a manual
      # workflow_dispatch) AND only when GITOPS_INFRA_TOKEN is set
      # (env.INFRA_TOKEN != ''). Either condition unmet => skipped-green, so the
      # feat/clerk-auth build and the not-yet-provisioned state both pass.

      - name: Checkout bentech-infra (GitOps stack repo)
        if: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && env.INFRA_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: lewis159/bentech-infra
          ref: main
          token: ${{ secrets.GITOPS_INFRA_TOKEN }}
          path: infra
          persist-credentials: true

      - name: Bump image SHA in bentech-infra & push
        id: bump
        if: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && env.INFRA_TOKEN != '' }}
        working-directory: infra
        run: |
          set -euo pipefail
          NEW_SHA="${{ github.sha }}"
          FILE="stacks/sentinel-ops-app.yml"
          # Precise, anchored replace: only the 40-hex tag on the sentinel image
          # line. Anchored on the literal prefix, matches exactly 40 hex chars,
          # so it can never touch :latest/:staging or any other line. Pushing this
          # change to bentech-infra main triggers the estate deploy.yml, which
          # redeploys stack 23 (sentinel-ops-app) via the Portainer API.
          sed -E -i "s|(image: ghcr\.io/lewis159/sentinel:)[0-9a-f]{40}|\1${NEW_SHA}|" "$FILE"
          if git diff --quiet -- "$FILE"; then
            echo "Image already pinned to ${NEW_SHA} — nothing to commit; deploy.yml will not fire."
            exit 0
          fi
          git config user.name  "sentinel-ci[bot]"
          git config user.email "sentinel-ci[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "deploy(sentinel): ops.bentech.dev -> ${NEW_SHA::7}"
          git push origin HEAD:main
