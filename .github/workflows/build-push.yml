name: Build & Push Sentinel

# Builds the Sentinel image and pushes it to GHCR on every push to main,
# or manually via the Actions tab. After a successful build+push it triggers
# an auto-redeploy by POSTing a Portainer SERVICE WEBHOOK (Portainer re-pulls
# :latest and rolls the service using ITS OWN creds — CI never holds the
# Portainer admin token). Mirrors the estate pattern in
# bentech-infra/docs/ci-cd-staging.md.
#
# Redeploy secret: PORTAINER_WEBHOOK_SENTINEL
#   - Value is an opaque Portainer service-webhook URL
#     (https://<portainer-host>/api/webhooks/<uuid>) — a capability URL scoped
#     to exactly one service. Treat it as a secret.
#   - Create it: Portainer -> the Sentinel service -> Service webhooks ->
#     toggle ON -> copy the URL, then:
#       gh secret set PORTAINER_WEBHOOK_SENTINEL -R lewis159/sentinel
#   - Until the secret is set the redeploy step is SKIPPED (not failed), so the
#     workflow still passes before the webhook is provisioned.

on:
  push:
    branches: [main, feat/clerk-auth]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Map the (possibly-unset) secret to a job-level env var so the redeploy
    # step's `if:` can gate on it. Secrets can't be referenced directly in an
    # `if:` expression, and a secret mapped at STEP level isn't visible to that
    # same step's own `if:` — so it must live at job level.
    env:
      HOOK: ${{ secrets.PORTAINER_WEBHOOK_SENTINEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lewis159/sentinel:latest
            ghcr.io/lewis159/sentinel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* values are inlined into the client bundle at build time.
          # The Clerk publishable key is NOT secret, so it's a repo Actions VARIABLE.
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      # Auto-redeploy: POST the opaque Portainer service webhook so Portainer
      # re-pulls :latest and rolls the service. Runs only for prod deploys
      # (push to main, or a manual workflow_dispatch) — never for the
      # feat/clerk-auth build. Skipped when the secret is unset (env.HOOK == '');
      # -f makes curl exit non-zero on any non-2xx response, so a broken/misfired
      # webhook fails the job loudly instead of passing silently.
      - name: Trigger Portainer redeploy
        if: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && env.HOOK != '' }}
        run: |
          echo "Triggering Portainer service webhook for Sentinel..."
          curl -fsS -X POST "$HOOK"
          echo "Portainer redeploy triggered."
